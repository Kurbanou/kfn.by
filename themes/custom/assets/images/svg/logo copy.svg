<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="neonGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#62C5E3"/>
      <stop offset="50%" stop-color="#4D78BB"/>
      <stop offset="100%" stop-color="#6A5DA5"/>
    </linearGradient>
    <linearGradient id="subGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#4D78BB"/>
      <stop offset="100%" stop-color="#6A5DA5"/>
    </linearGradient>
  </defs>

  <!-- Внешний квадрат -->
  <rect x="40" y="40" width="432" height="432" rx="80"
        fill="none" stroke="url(#neonGrad)" stroke-width="6"/>

  <!-- Внутренний квадрат -->
  <rect x="68" y="68" width="376" height="376" rx="60"
        fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.35"/>

  <!-- Глобус -->
  <g transform="translate(256, 220)">
    <circle r="120" fill="none" stroke="url(#neonGrad)" stroke-width="3"/>
    <ellipse rx="120" ry="34" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.9"/>
    <ellipse rx="120" ry="68" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.8"/>
    <ellipse rx="120" ry="98" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.5"/>
    <ellipse rx="34" ry="120" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.9"/>
    <ellipse rx="68" ry="120" fill="none" stroke="url(#neonGrad)" stroke-width="2" opacity="0.8"/>
    <ellipse rx="98" ry="120" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.5"/>
    <line x1="-120" y1="0" x2="120" y2="0" stroke="url(#neonGrad)" stroke-width="2.5" opacity="0.9"/>
    <circle r="4" fill="#4D78BB"/>
    <!-- Орбита -->
    <ellipse rx="138" ry="52" fill="none" stroke="url(#neonGrad)" stroke-width="1.5" opacity="0.35" transform="rotate(-25)"/>
  </g>

  <!-- KFN -->
  <text x="256" y="300"
        fill="url(#neonGrad)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="86"
        font-weight="800"
        text-anchor="middle">KFN</text>

  <!-- Разделительная линия -->
  <line x1="150" y1="325" x2="362" y2="325"
        stroke="url(#neonGrad)" stroke-width="2" opacity="0.6"/>

  <!-- WEB STUDIO -->
  <text x="256" y="360"
        fill="url(#subGrad)"
        font-family="Arial, Helvetica, sans-serif"
        font-size="22"
        font-weight="400"
        text-anchor="middle">WEB STUDIO</text>
</svg>